id: cis-debian-12-1.1.1
os: debian-12
title: Ensure /tmp is on separate partition
benchmark: CIS Debian 12
level: 1
description: Ensure separate partition exists for /tmp
check:
  bash: |
    mount | grep -E '\s/tmp\s'
remediation:
  bash: |
    echo "Separate /tmp partition recommended. Manual intervention required."
references:
  - https://www.debian.org/doc/manuals/securing-debian-manual/
controls:
  - CIS 1.1.1
