id: cis-ubuntu-20.04-1.1.8
os: ubuntu-20.04
title: Ensure nodev option set on /var/tmp partition
benchmark: CIS Ubuntu 20.04 LTS
level: 1
description: Ensure nodev option is set on /var/tmp partition
needs_sudo: false
check:
