id: cis-ubuntu-20.04-1.1.3
os: ubuntu-20.04
title: Ensure nosuid option set on /tmp partition
benchmark: CIS Ubuntu 20.04 LTS
level: 1
description: Ensure nosuid option is set on /tmp partition
needs_sudo: false
check:
