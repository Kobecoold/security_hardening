id: cis-ubuntu-20.04-5.3.1
os: ubuntu-20.04
title: Ensure SSH Protocol is set to 2
benchmark: CIS Ubuntu 20.04 LTS
level: 1
description: Ensure Protocol in /etc/ssh/sshd_config is set to 2
needs_sudo: false
check:
  bash: |
    # Method 1: Check running SSH daemon config
    if command -v sshd >/dev/null 2>&1; then
      if sshd -T 2>/dev/null | grep -iE '^protocol' | grep -qiE '[[:space:]]*2[[:space:]]*$'; then
        exit 0
      fi
    fi
    
    # Method 2: Check main config file
    if [ -r /etc/ssh/sshd_config ]; then
      if grep -iE '^[[:space:]]*Protocol[[:space:]]+2' /etc/ssh/sshd_config >/dev/null 2>&1; then
        exit 0
      fi
    fi
    
    # Method 3: Check config.d directory
    if [ -d /etc/ssh/sshd_config.d ] && [ -r /etc/ssh/sshd_config.d ]; then
      for f in /etc/ssh/sshd_config.d/*.conf; do
        [ -f "$f" ] && [ -r "$f" ] || continue
        if grep -iE '^[[:space:]]*Protocol[[:space:]]+2' "$f" >/dev/null 2>&1; then
          exit 0
        fi
      done
    fi
    
    exit 1
references:
  - https://ubuntu.com/security/cis
controls:
  - CIS 5.3.1

