id: cis-ubuntu-20.04-5.3.3
os: ubuntu-20.04
title: Ensure SSH PermitEmptyPasswords is disabled
benchmark: CIS Ubuntu 20.04 LTS
level: 1
description: Ensure PermitEmptyPasswords is set to no in /etc/ssh/sshd_config
needs_sudo: false
check:
  bash: |
    # Debug: Log what we're checking
    set +e  # Don't exit on error, we want to try all methods
    
    # Method 1: Check running SSH daemon config (most accurate)
    # sshd -T reads the effective config from running daemon
    if command -v sshd >/dev/null 2>&1; then
      sshd_output=$(sshd -T 2>&1)
      sshd_exit=$?
      if [ $sshd_exit -eq 0 ]; then
        permit_empty=$(echo "$sshd_output" | grep -iE '^permitemptypasswords' | head -1)
        if echo "$permit_empty" | grep -qiE '(no|false)'; then
          exit 0
        fi
      fi
    fi
    
    # Method 2: Check main config file directly
    # This should work even without sudo if file is readable
    if [ -r /etc/ssh/sshd_config ]; then
      if grep -iE '^[[:space:]]*PermitEmptyPasswords[[:space:]]+no' /etc/ssh/sshd_config >/dev/null 2>&1; then
        exit 0
      fi
      # Also check for commented but active lines
      if grep -iE '^[[:space:]]*#?[[:space:]]*PermitEmptyPasswords[[:space:]]+no' /etc/ssh/sshd_config >/dev/null 2>&1; then
        exit 0
      fi
    fi
    
    # Method 3: Check config.d directory (Ubuntu/Debian may use this)
    if [ -d /etc/ssh/sshd_config.d ] && [ -r /etc/ssh/sshd_config.d ]; then
      for f in /etc/ssh/sshd_config.d/*.conf; do
        [ -f "$f" ] && [ -r "$f" ] || continue
        if grep -iE '^[[:space:]]*PermitEmptyPasswords[[:space:]]+no' "$f" >/dev/null 2>&1; then
          exit 0
        fi
      done
    fi
    
    # Method 4: Try with cat (sometimes more reliable than grep)
    if [ -r /etc/ssh/sshd_config ]; then
      if cat /etc/ssh/sshd_config | grep -iE '^[[:space:]]*PermitEmptyPasswords[[:space:]]+no' >/dev/null 2>&1; then
        exit 0
      fi
    fi
    
    # All methods failed
    exit 1
references:
  - https://ubuntu.com/security/cis
controls:
  - CIS 5.3.3

