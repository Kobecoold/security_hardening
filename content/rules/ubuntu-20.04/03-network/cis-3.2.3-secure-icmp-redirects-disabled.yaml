id: cis-ubuntu-20.04-3.2.3
os: ubuntu-20.04
title: Ensure secure ICMP redirects are not accepted
benchmark: CIS Ubuntu 20.04 LTS
level: 1
description: Ensure secure ICMP redirects are not accepted
needs_sudo: false
check:
  bash: |
    sysctl net.ipv4.conf.all.secure_redirects | grep -q "net.ipv4.conf.all.secure_redirects = 0"
references:
  - https://ubuntu.com/security/cis
controls:
  - CIS 3.2.3

