id: cis-ubuntu-20.04-3.2.7
os: ubuntu-20.04
title: Ensure Reverse Path Filtering is enabled
benchmark: CIS Ubuntu 20.04 LTS
level: 1
description: Ensure Reverse Path Filtering is enabled
needs_sudo: false
check:
  bash: |
    sysctl net.ipv4.conf.all.rp_filter | grep -q "net.ipv4.conf.all.rp_filter = 1"
references:
  - https://ubuntu.com/security/cis
controls:
  - CIS 3.2.7

