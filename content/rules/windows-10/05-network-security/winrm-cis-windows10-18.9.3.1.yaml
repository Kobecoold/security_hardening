id: winrm-cis-windows10-18.9.3.1
os: windows-10
title: Ensure 'Include command line in process creation events' is set to 'Enabled'
benchmark: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0
level: 1
description: Ghi lại dòng lệnh khi process được tạo.
needs_sudo: false
check:
  winrm: reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit" /v ProcessCreationIncludeCmdLine_Enabled 2>nul || echo KEY_NOT_EXIST
  expected: "0x1"
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 18.9.3.1
