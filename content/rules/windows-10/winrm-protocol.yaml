id: winrm-cis-windows10-18.9.58.2
os: windows-10
title: Configure WinRM to Use HTTPS
benchmark: CIS Windows 10
level: 1
description: Ensure WinRM uses HTTPS protocol for secure communication
check:
  winrm: winrm get winrm/config/Service | findstr "AllowUnencrypted"
  expected: "AllowUnencrypted = false"
remediation:
  winrm: winrm set winrm/config/Service @{AllowUnencrypted="false"}
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 18.9.58.2

