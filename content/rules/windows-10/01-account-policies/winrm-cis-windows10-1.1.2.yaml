id: winrm-cis-windows10-1.1.2
os: windows-10
title: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'
benchmark: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0
level: 1
description: Xác định thời gian tối đa (ngày) mà mật khẩu có thể được sử dụng trước khi hết hạn.
needs_sudo: false
check:
  winrm: net accounts | findstr "Maximum password age"
  expected: "Maximum password age"
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 1.1.2
