id: winrm-cis-windows10-2.3.1.2
os: windows-10
title: Disable Guest Account
benchmark: CIS Windows 10
level: 1
description: Ensure Guest account is disabled
check:
  winrm: net user Guest | findstr "Account active"
  expected: "No"
remediation:
  winrm: net user Guest /active:no
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 2.3.1.2

