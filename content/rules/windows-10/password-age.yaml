id: winrm-cis-windows10-1.2.4
os: windows-10
title: Configure Maximum Password Age
benchmark: CIS Windows 10
level: 1
description: Set maximum password age to 60 days
check:
  winrm: net accounts | findstr "Maximum password age"
  expected: "Maximum password age"
remediation:
  winrm: net accounts /maxpwage:60
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 1.2.4

