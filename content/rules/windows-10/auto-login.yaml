id: winrm-cis-windows10-2.3.7.1
os: windows-10
title: Disable Automatic Logon
benchmark: CIS Windows 10
level: 1
description: Ensure automatic logon is disabled
check:
  winrm: reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v AutoAdminLogon
  expected: "AutoAdminLogon    REG_SZ    0"
remediation:
  winrm: reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v AutoAdminLogon /t REG_SZ /d 0 /f
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 2.3.7.1

