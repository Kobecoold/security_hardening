id: winrm-cis-windows10-19.7.1.1
os: windows-10
title: Ensure BitLocker is Enabled
benchmark: CIS Windows 10
level: 2
description: Ensure BitLocker Drive Encryption is enabled for system drive
check:
  winrm: manage-bde -status | findstr "Protection Status"
  expected: "Protection Status:    Protection On"
remediation:
  winrm: manage-bde -on C: -RecoveryPassword
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 19.7.1.1

