id: winrm-cis-windows10-2.3.7.2
os: windows-10
title: Ensure 'Interactive logon Don't display last signed-in' is set to 'Enabled'
benchmark: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0
level: 1
description: Không hiển thị tên người dùng đăng nhập lần cuối trên màn hình đăng nhập.
needs_sudo: false
check:
  winrm: reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v DontDisplayLastUserName 2>nul || echo KEY_NOT_EXIST
  expected: "0x1"
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 2.3.7.2
