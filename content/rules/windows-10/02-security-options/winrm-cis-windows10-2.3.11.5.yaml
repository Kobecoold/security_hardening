id: winrm-cis-windows10-2.3.11.5
os: windows-10
title: Ensure 'Network security Do not store LAN Manager hash value on next password change' is set to 'Enabled'
benchmark: CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0
level: 1
description: Ngăn lưu hash LAN Manager khi thay đổi mật khẩu.
needs_sudo: false
check:
  winrm: reg query "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa" /v NoLMHash
  expected: "0x1"
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 2.3.11.5
