id: winrm-cis-windows10-9.1.1
os: windows-10
title: Ensure Windows Firewall Domain Profile is Enabled
benchmark: CIS Windows 10
level: 1
description: Ensure Windows Firewall is enabled for Domain profile
check:
  winrm: netsh advfirewall show allprofiles | findstr "State"
  expected: "State                                 ON"
remediation:
  winrm: netsh advfirewall set allprofiles state on
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 9.1.1

