id: winrm-cis-windows10-2.3.8.1
os: windows-10
title: Disable Remote Assistance
benchmark: CIS Windows 10
level: 1
description: Disable Remote Assistance to prevent unauthorized access
check:
  winrm: reg query "HKLM\SYSTEM\CurrentControlSet\Control\Remote Assistance" /v fAllowToGetHelp
  expected: "fAllowToGetHelp REG_DWORD 0x0"
remediation:
  winrm: reg add "HKLM\SYSTEM\CurrentControlSet\Control\Remote Assistance" /v fAllowToGetHelp /t REG_DWORD /d 0 /f
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 2.3.8.1
