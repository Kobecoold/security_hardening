id: winrm-cis-windows10-18.9.1.2
os: windows-10
title: Ensure SSL Certificate Exists for WinRM
benchmark: CIS Windows 10
level: 1
description: Verify SSL certificate is available and valid for WinRM HTTPS
check:
  winrm: |
    powershell -Command "Get-ChildItem -Path Cert:\LocalMachine\My | Where-Object {$_.HasPrivateKey -eq $true} | Measure-Object | Select-Object -ExpandProperty Count"
  expected: "2"
remediation:
  winrm: |
    echo "SSL certificates detected:"
    powershell -Command "Get-ChildItem -Path Cert:\LocalMachine\My | Where-Object {$_.HasPrivateKey -eq $true} | Format-Table Subject, Thumbprint"
references:
  - https://learn.microsoft.com/en-us/windows/win32/winrm
controls:
  - CIS 18.9.1.2
