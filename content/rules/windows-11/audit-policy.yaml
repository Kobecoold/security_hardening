id: winrm-cis-windows10-17.2.1
os: windows-10
title: Enable Audit Logon Events
benchmark: CIS Windows 10
level: 1
description: Enable auditing for logon events
check:
  winrm: auditpol /get /subcategory:"Logon"
  expected: "Success and Failure"
remediation:
  winrm: auditpol /set /subcategory:"Logon" /success:enable /failure:enable
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 17.2.1
