- id: cis-windows10-18.9.1
  os: windows-10
  title: Ensure 'OpenSSH Server' service is running
  benchmark: CIS Microsoft Windows 10 Enterprise
  level: 1
  description: Ensure the OpenSSH Server service is running to allow secure remote management.
  check:
    cmd: sc query sshd
    expected: "STATE              : 4  RUNNING"
  remediation:
    cmd: sc config sshd start= auto && net start sshd
  references:
    - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
  controls:
    - CIS 18.9.1

- id: cis-windows10-2.3.11.1
  os: windows-10
  title: Ensure 'hosts' file exists and is not empty
  benchmark: CIS Microsoft Windows 10 Enterprise
  level: 1
  description: The hosts file should exist and contain at least the default entries.
  check:
    cmd: dir C:\Windows\System32\drivers\etc\hosts
    expected: "hosts"
  remediation:
    cmd: echo 127.0.0.1   localhost > C:\Windows\System32\drivers\etc\hosts
  references:
    - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
  controls:
    - CIS 2.3.11.1
