id: winrm-cis-windows10-1.1.1
os: windows-10
title: Ensure Minimum Password Length
benchmark: CIS Windows 10
level: 1
description: Set minimum password length to 14 characters
check:
  winrm: net accounts | findstr "Minimum password length"
  expected: "Minimum password length:                              14"
remediation:
  winrm: net accounts /minpwlen:14
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 1.1.1
