id: winrm-cis-windows10-1.2.1
os: windows-10
title: Configure Account Lockout Threshold
benchmark: CIS Windows 10
level: 1
description: Set account lockout threshold after failed attempts
check:
  winrm: net accounts | findstr "Lockout threshold"
  expected: "Lockout threshold:                                    5"
remediation:
  winrm: net accounts /lockoutthreshold:5
references:
  - https://www.cisecurity.org/benchmark/microsoft_windows_desktop
controls:
  - CIS 1.2.1
