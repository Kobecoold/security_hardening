id: win11-audit-account-logon
title: Ensure 'Audit Account Logon Events' is enabled
os: windows-11
benchmark: CIS Windows 11 Enterprise
level: 1
description: Ensure auditing of account logon events
check:
  powershell: |
    AuditPol /get /subcategory:"Account Logon" | Select-String "Success and Failure"
remediation:
  powershell: |
    AuditPol /set /subcategory:"Account Logon" /success:enable /failure:enable
references:
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-audit-account-logon-events
controls:
  - CIS 17.2.1
