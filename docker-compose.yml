version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: security_hardening_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=security_hardening
    networks:
      - security_hardening_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/security_hardening --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  security_hardening_network:
    driver: bridge
